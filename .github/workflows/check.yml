name: Android and Linux checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :shared:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/build/outputs/apk/debug/youschool_*.apk
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git jdk17-openjdk libx11 libxext libxi libxrender libxtst fontconfig freetype2 alsa-lib libglvnd libnotify libsecret gtk3 xorg-server-xvfb
      - uses: actions/checkout@v4
      - run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && JAVA_HOME=/usr/lib/jvm/java-17-openjdk xvfb-run -a bash ./gradlew -PdesktopOnly=true :shared:test :desktop:test --console=plain"
          su builder -c "cd '$GITHUB_WORKSPACE' && JAVA_HOME=/usr/lib/jvm/java-17-openjdk bash scripts/build-arch.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: youschool-arch-x86_64
          path: |
            desktop/build/arch/*.pkg.tar.zst
            desktop/build/arch/youschool_*_linux_x86_64.tar.gz
  android-instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            bash ./gradlew :app:installDebug
            adb shell pm grant org.youschool.app android.permission.POST_NOTIFICATIONS
            bash ./gradlew :app:connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-results
          path: app/build/reports/androidTests/connected/
